name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rozpakuj projekt
        run: unzip -q KaucjaPRO.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Zbuduj APK
        working-directory: KaucjaPRO
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: KaucjaPRO-apk
          path: KaucjaPRO/app/build/outputs/apk/debug/app-debug.apk
