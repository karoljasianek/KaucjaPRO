name: Build KaucjaPRO APK

on:
  push:
  pull_request:
  workflow_dispatch:   # pozwala uruchomić ręcznie: zakładka Actions -> Run workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Cache Gradle + weryfikacja gradle-wrapper.jar
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Zbuduj APK (debug)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Testy jednostkowe
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Nazwij plik
        run: cp app/build/outputs/apk/debug/app-debug.apk KaucjaPRO.apk

      - name: Zapisz APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: KaucjaPRO-apk
          path: KaucjaPRO.apk
          if-no-files-found: error

      - name: Zapisz raporty (testy, lint)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
